[project]
name = "ezmsg-ble"
version = "0.1.0"
description = "Bluetooth Low-energy GATT client/server for ezmsg"
authors = [
    { name = "Griffin Milsap", email = "griffin.milsap@jhuapl.edu" },
]
readme = "README.md"
homepage = "https://github.com/griffinmilsap/ezmsg-ble"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22.3",
    "bless>=0.2.6",
    "ezmsg>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmsg"]
